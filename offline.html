<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLO.RISTA — Нет подключения</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6C5CE7 0%, #a29bfe 100%);
      padding: 20px;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
      max-width: 500px;
      text-align: center;
    }
    .emoji { font-size: 72px; margin-bottom: 16px; }
    h1 { color: #111827; font-size: 28px; margin-bottom: 12px; }
    p { color: #6b7280; line-height: 1.6; margin-bottom: 20px; }
    .hint { color: #9ca3af; font-size: 13px; margin-top: 16px; }
    button {
      padding: 14px 32px;
      background: #6C5CE7;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      margin: 4px;
    }
    button:hover { background: #5849d6; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(108,92,231,.3); }
    button.ghost { background: #f3f4f6; color: #374151; }
    button.ghost:hover { background: #e5e7eb; box-shadow: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>Нет подключения к сети</h1>
    <p>
      Не удалось загрузить приложение. Проверьте подключение к интернету.<br><br>
      <strong>Хорошие новости:</strong> все ваши данные сохранены локально
      и будут синхронизированы при восстановлении связи.
    </p>
    <button onclick="location.reload()">🔄 Обновить страницу</button>
    <button class="ghost" onclick="history.back()">← Назад</button>
    <div class="hint">
      FLO.RISTA Pro — работает offline ✨
    </div>
  </div>
</body>
</html>
